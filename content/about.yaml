name: Juppy
intro: |-
  Hi, I'm Juppy. I'm a `software engineer` — the kind who falls down rabbit
  holes, keeps half a dozen side projects on life support, and genuinely
  loves shipping things people use.

  Over a decade of building for the web taught me the best work happens with
  people who care. So that's what I look for: brands and teams out to do
  `something cool`, who want someone to sweat the details alongside them.
